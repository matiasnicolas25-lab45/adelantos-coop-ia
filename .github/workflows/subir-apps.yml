name: Subir apps a Google
on:
  push:
    branches: [ccr-e008e6de-2fulh4]
    paths: ["apps/horarios-google/Codigo.gs", "apps/cuentas/Codigo.gs", "deploy/**", ".github/workflows/subir-apps.yml"]
  workflow_dispatch:
jobs:
  subir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Probar antes de publicar (si algo falla, no se publica)
        run: node deploy/probar.js
      - run: npm install -g @google/clasp@2.4.2
      - name: Llave de Google (secreto CLASPRC_JSON)
        env: { CLASPRC_JSON: "${{ secrets.CLASPRC_JSON || secrets.CLAPSPRC_JSON }}" }
        run: |
          if [ -z "$CLASPRC_JSON" ]; then echo "Falta el secreto CLASPRC_JSON"; exit 1; fi
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
      - run: deploy/subir.sh
