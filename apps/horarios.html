<title>Horarios La Caleta</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Narrow:wght@500;600;700&display=swap">
<style>
/* Layout: una columna; arriba el panel para marcar (botones grandes por persona), abajo la planilla semanal sábado a viernes como la del papel. */
:root {
  --paper: #f3f5f7;
  --card: #ffffff;
  --ink: #14213a;
  --muted: #5b6577;
  --line: #d5dbe3;
  --navy: #1d3a66;
  --navy-ink: #ffffff;
  --ochre: #b8741a;
  --in: #1f7a4d;
  --in-bg: #e3f3ea;
  --out: #a33a2c;
  --soft: #e9edf2;
  --f-body: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-narrow: "Archivo Narrow", "Arial Narrow", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0f1522; --card: #172033; --ink: #e8edf5; --muted: #9aa6b8; --line: #2a3550;
  --navy: #7fa6e0; --navy-ink: #0f1522; --ochre: #e0a24f; --in: #5fd39a; --in-bg: #16342a;
  --out: #ef8c7d; --soft: #1e2940; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #0f1522; --card: #172033; --ink: #e8edf5; --muted: #9aa6b8; --line: #2a3550;
  --navy: #7fa6e0; --navy-ink: #0f1522; --ochre: #e0a24f; --in: #5fd39a; --in-bg: #16342a;
  --out: #ef8c7d; --soft: #1e2940; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font: 15px/1.45 var(--f-body); }
.wrap { max-width: 1100px; margin: 0 auto; padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 22px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
h1 { font: 700 26px/1.1 var(--f-narrow); margin: 0; letter-spacing: .01em; text-wrap: balance; }
h1 small { display: block; font: 500 13px var(--f-body); color: var(--muted); letter-spacing: 0; margin-top: 4px; }
h2 { font: 700 13px var(--f-narrow); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0; }
.clock { font: 600 30px var(--f-narrow); font-variant-numeric: tabular-nums; color: var(--navy); }
.note { background: var(--soft); border-radius: 8px; padding: 10px 12px; color: var(--muted); font-size: 14px; }
.note[hidden] { display: none; }
section { display: grid; gap: 12px; }

/* Marcar */
.people { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.person { font: 600 15px var(--f-body); text-align: left; padding: 12px 12px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--card); color: var(--ink); cursor: pointer; display: grid; gap: 2px; min-height: 58px; }
.person span { font: 500 12px var(--f-narrow); color: var(--muted); letter-spacing: .02em; }
.person.inside { border-color: var(--in); background: var(--in-bg); }
.person.inside span { color: var(--in); }
.person:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--ochre); outline-offset: 2px; }

/* Panel de marcar */
.sheet { position: fixed; inset: 0; background: rgb(10 15 25 / .45); display: grid; place-items: end center; z-index: 20;
  padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet-box { background: var(--card); color: var(--ink); width: min(520px, 100%); border-radius: 14px 14px 0 0;
  padding: 20px max(16px, env(safe-area-inset-left, 0px)) 24px; display: grid; gap: 14px; max-height: 90vh; overflow: auto; }
@media (min-width: 640px) { .sheet { place-items: center; } .sheet-box { border-radius: 14px; } }
.sheet-box h3 { margin: 0; font: 700 22px var(--f-narrow); }
.status { color: var(--muted); }
.status b { color: var(--in); }
.big { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn { font: 700 17px var(--f-body); padding: 16px 12px; border-radius: 10px; border: 0; cursor: pointer; }
.btn-in { background: var(--in); color: var(--card); }
.btn-out { background: var(--out); color: var(--card); }
.btn:disabled { opacity: .35; cursor: not-allowed; }
.btn-plain { font: 600 14px var(--f-body); background: transparent; border: 1px solid var(--line); color: var(--ink); padding: 10px 14px; border-radius: 8px; cursor: pointer; }
.btn-main { font: 600 14px var(--f-body); background: var(--navy); border: 0; color: var(--navy-ink); padding: 10px 14px; border-radius: 8px; cursor: pointer; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row.end { justify-content: flex-end; }

/* Semana */
.weeknav { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.weeknav strong { font: 600 16px var(--f-narrow); }
.tablebox { overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; min-width: 1000px; font-variant-numeric: tabular-nums; }
th, td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 6px 8px; vertical-align: top; text-align: left; }
th { font: 700 12px var(--f-narrow); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); background: var(--soft); white-space: nowrap; }
th.today { color: var(--navy); }
td.name { font: 600 14px var(--f-body); white-space: nowrap; position: sticky; left: 0; background: var(--card); }
td.cell { cursor: pointer; min-width: 96px; font: 500 13px var(--f-narrow); }
td.cell:hover { background: var(--soft); }
td.cell .t { display: block; white-space: nowrap; }
td.cell .open { color: var(--in); font-weight: 700; }
td.cell .hand { color: var(--ochre); }
td.cell .empty { color: var(--line); }
td.hs { font: 700 14px var(--f-narrow); white-space: nowrap; text-align: right; }
tfoot td { font: 700 13px var(--f-narrow); background: var(--soft); }
.legend { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 16px; }
.legend i { font-style: normal; font-weight: 700; }

/* Editor de un día */
.shift { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; align-items: end; }
.shift label { display: grid; gap: 4px; font: 600 12px var(--f-narrow); color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
input[type=time], input[type=text], textarea { font: 500 16px var(--f-body); padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); width: 100%; }
textarea { min-height: 220px; resize: vertical; }
.x { font: 700 16px var(--f-body); border: 1px solid var(--line); background: transparent; color: var(--out); border-radius: 8px; width: 42px; height: 42px; cursor: pointer; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--paper);
  padding: 12px 18px; border-radius: 10px; font-weight: 600; z-index: 30; max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: no-preference) { .toast { transition: opacity .2s; } }
</style>

<div class="wrap">
  <header>
    <h1>Horarios La Caleta<small id="hoy"></small></h1>
    <div class="clock" id="clock" aria-live="off">--:--</div>
  </header>

  <p class="note" id="msg">Cargando la planilla…</p>

  <section aria-labelledby="t-marcar">
    <h2 id="t-marcar">Marcar entrada o salida: tocá tu nombre</h2>
    <div class="people" id="people"></div>
  </section>

  <section aria-labelledby="t-semana">
    <div class="weeknav">
      <h2 id="t-semana">Semana</h2>
      <div class="row">
        <button class="btn-plain" id="prev" type="button">← Anterior</button>
        <strong id="weeklabel"></strong>
        <button class="btn-plain" id="next" type="button">Siguiente →</button>
        <button class="btn-plain" id="thisweek" type="button">Esta semana</button>
      </div>
    </div>
    <div class="tablebox"><table id="grid"></table></div>
    <div class="legend">
      <span><i class="open">● adentro</i>: marcó entrada y todavía no salió</span>
      <span><i style="color:var(--ochre)">✎</i>: corregido a mano</span>
      <span>Tocá un casillero para corregir o cargar un horario.</span>
    </div>
    <div class="row end"><button class="btn-plain" id="editstaff" type="button" hidden>Editar personal y valor hora</button></div>
  </section>
</div>

<div class="sheet" id="sheet" hidden><div class="sheet-box" id="sheetbox" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
const DIAS = ["Sábado", "Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes"];
const state = { db: null, user: null, canWrite: false, canEdit: false,  staff: [], valores: {}, valoresFecha: "", week: [], open: [], weekStart: startOfWeek(new Date()), unsubWeek: null };
const $ = id => document.getElementById(id);

function pad(n) { return String(n).padStart(2, "0"); }
function iso(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function hhmm(d) { return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
function startOfWeek(d) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 1) % 7)); return x; }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function ddmm(d) { return pad(d.getDate()) + "/" + pad(d.getMonth() + 1); }
function mins(t) { const [h, m] = t.split(":").map(Number); return h * 60 + m; }
function dur(t) { if (!t.salida) return 0; let m = mins(t.salida) - mins(t.entrada); if (m < 0) m += 1440; return m; }
function pesos(n) { return "$" + Math.round(n).toLocaleString("es-AR"); }
function plata(name, m) { const v = state.valores[name]; return v && m ? m / 60 * v : 0; }
function fmtHs(m) { return m ? Math.floor(m / 60) + ":" + pad(m % 60) : ""; }
function toast(txt) { const t = $("toast"); t.textContent = txt; t.hidden = false; clearTimeout(toast.k); toast.k = setTimeout(() => t.hidden = true, 3200); }
function note(txt) { $("msg").textContent = txt || ""; $("msg").hidden = !txt; }

function tick() { const n = new Date(); $("clock").textContent = hhmm(n);
  $("hoy").textContent = n.toLocaleDateString("es-AR", { weekday: "long", day: "numeric", month: "long" }); }
tick(); setInterval(tick, 15000);

/* ---------- render ---------- */
function openFor(p) { return state.open.filter(t => t.persona === p).sort((a, b) => (a.dia + a.entrada < b.dia + b.entrada ? 1 : -1))[0]; }

function renderPeople() {
  const box = $("people"); box.textContent = "";
  if (!state.staff.length) { const p = document.createElement("p"); p.className = "note";
    p.textContent = state.canEdit ? "Todavía no hay personal cargado. Usá \"Editar personal y valor hora\" abajo para agregar los nombres." : "Todavía no hay personal cargado.";
    box.append(p); return; }
  for (const name of state.staff) {
    const o = openFor(name); const b = document.createElement("button");
    b.type = "button"; b.className = "person" + (o ? " inside" : "");
    b.textContent = name; const s = document.createElement("span");
    s.textContent = o ? "Adentro desde las " + o.entrada + (o.dia !== iso(new Date()) ? " (" + ddmm(new Date(o.dia + "T00:00")) + ")" : "") : "Afuera";
    b.append(s); b.addEventListener("click", () => openMark(name)); box.append(b);
  }
}

function renderWeek() {
  const ws = state.weekStart, days = DIAS.map((_, i) => addDays(ws, i)), today = iso(new Date());
  $("weeklabel").textContent = "Del sábado " + ddmm(days[0]) + " al viernes " + ddmm(days[6]);
  const t = $("grid"); t.textContent = "";
  const thead = t.createTHead().insertRow();
  const th0 = document.createElement("th"); th0.textContent = "Nombre"; thead.append(th0);
  days.forEach((d, i) => { const th = document.createElement("th"); th.textContent = DIAS[i] + " " + pad(d.getDate()); if (iso(d) === today) th.className = "today"; thead.append(th); });
  const thh = document.createElement("th"); thh.textContent = "HS"; thead.append(thh);
  const thv = document.createElement("th"); thv.textContent = "Valor hora"; thead.append(thv);
  const thp = document.createElement("th"); thp.textContent = "A cobrar"; thead.append(thp);
  const body = t.createTBody(); const dayTot = Array(7).fill(0); let grand = 0, grandPlata = 0;
  const names = [...state.staff]; for (const x of state.week) if (!names.includes(x.persona)) names.push(x.persona);
  for (const name of names) {
    const tr = body.insertRow(); const tdn = tr.insertCell(); tdn.className = "name"; tdn.textContent = name; let tot = 0;
    days.forEach((d, i) => {
      const td = tr.insertCell(); td.className = "cell"; const key = iso(d);
      const ts = state.week.filter(x => x.persona === name && x.dia === key).sort((a, b) => a.entrada < b.entrada ? -1 : 1);
      if (!ts.length) { const s = document.createElement("span"); s.className = "empty"; s.textContent = "—"; td.append(s); }
      for (const x of ts) { const s = document.createElement("span"); s.className = "t" + (x.salida ? "" : " open") + (x.mano ? " hand" : "");
        s.textContent = x.entrada + " – " + (x.salida || "●") + (x.mano ? " ✎" : ""); td.append(s); const m = dur(x); tot += m; dayTot[i] += m; }
      td.tabIndex = 0; td.setAttribute("role", "button"); td.setAttribute("aria-label", name + ", " + DIAS[i] + " " + ddmm(d));
      td.addEventListener("click", () => openDay(name, key));
      td.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openDay(name, key); } });
    });
    grand += tot; const tdh = tr.insertCell(); tdh.className = "hs"; tdh.textContent = fmtHs(tot);
    const v = state.valores[name]; const tdv = tr.insertCell(); tdv.className = "hs"; tdv.textContent = v ? pesos(v) : "sin valor";
    const p = plata(name, tot); grandPlata += p; const tdp = tr.insertCell(); tdp.className = "hs"; tdp.textContent = p ? pesos(p) : "";
  }
  const f = t.createTFoot().insertRow(); const c0 = f.insertCell(); c0.textContent = "Total del día";
  dayTot.forEach(m => f.insertCell().textContent = fmtHs(m)); const cg = f.insertCell(); cg.className = "hs"; cg.textContent = fmtHs(grand);
  f.insertCell().textContent = state.valoresFecha ? "valores " + state.valoresFecha : ""; const cp = f.insertCell(); cp.className = "hs"; cp.textContent = grandPlata ? pesos(grandPlata) : "";
}

/* ---------- sheet ---------- */
function closeSheet() { $("sheet").hidden = true; $("sheetbox").textContent = ""; }
$("sheet").addEventListener("click", e => { if (e.target.id === "sheet") closeSheet(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
function el(tag, props = {}, ...kids) { const e = document.createElement(tag); Object.assign(e, props); e.append(...kids); return e; }

function openMark(name) {
  const o = openFor(name), box = $("sheetbox"); box.textContent = "";
  const now = hhmm(new Date());
  const st = el("p", { className: "status" });
  if (o) st.append("Entró a las ", el("b", { textContent: o.entrada }), o.dia !== iso(new Date()) ? " del " + ddmm(new Date(o.dia + "T00:00")) : "", ". ¿Ya te vas?");
  else st.append("Ahora son las " + now + ".");
  const bin = el("button", { className: "btn btn-in", type: "button", textContent: "Entré", disabled: !!o || !state.canWrite });
  const bout = el("button", { className: "btn btn-out", type: "button", textContent: "Salí", disabled: !o || !state.canWrite });
  bin.addEventListener("click", () => marcar(name, "in", bin));
  bout.addEventListener("click", () => marcar(name, "out", bout));
  box.append(el("h3", { textContent: name }), st, el("div", { className: "big" }, bin, bout));
  if (!state.canWrite) box.append(el("p", { className: "note", textContent: "Con tu acceso solo podés ver la planilla. Para marcar, pedile a Matías acceso de Colaborador." }));
  const close = el("button", { className: "btn-plain", type: "button", textContent: "Cerrar" }); close.addEventListener("click", closeSheet);
  box.append(el("div", { className: "row end" }, close));
  $("sheet").hidden = false; (o ? bout : bin).focus();
}

async function marcar(name, tipo, btn) {
  btn.disabled = true; const n = new Date();
  try {
    if (tipo === "in") {
      await state.db.collection("turnos").add({ persona: name, dia: iso(n), entrada: hhmm(n), salida: "", mano: false, marcado: n.toISOString() });
      toast(name + " entró a las " + hhmm(n));
    } else {
      const o = openFor(name); if (!o) return;
      await state.db.doc("turnos/" + o.id).update({ salida: hhmm(n), salidaMarcada: n.toISOString() });
      toast(name + " salió a las " + hhmm(n));
    }
    closeSheet();
  } catch (e) { btn.disabled = false; toast(e && e.code === "invalid_argument" ? "No tenés permiso para marcar." : "No se pudo guardar. Probá de nuevo."); }
}

function openDay(name, dia) {
  const box = $("sheetbox"); box.textContent = "";
  const d = new Date(dia + "T00:00"); const list = el("div", { style: "display:grid;gap:10px" });
  const rows = state.week.filter(x => x.persona === name && x.dia === dia).sort((a, b) => a.entrada < b.entrada ? -1 : 1)
    .map(x => ({ id: x.id, entrada: x.entrada, salida: x.salida, orig: x }));
  function draw() {
    list.textContent = "";
    if (!rows.length) list.append(el("p", { className: "status", textContent: "No hay horarios este día." }));
    rows.forEach((r, i) => {
      const a = el("input", { type: "time", value: r.entrada, id: "e" + i }); const b = el("input", { type: "time", value: r.salida, id: "s" + i });
      a.addEventListener("input", () => r.entrada = a.value); b.addEventListener("input", () => r.salida = b.value);
      const x = el("button", { className: "x", type: "button", textContent: "✕", title: "Borrar este horario" });
      x.setAttribute("aria-label", "Borrar este horario"); x.addEventListener("click", () => { r.borrar = true; rows.splice(i, 1); removed.push(r); draw(); });
      list.append(el("div", { className: "shift" }, el("label", { htmlFor: a.id }, "Entrada", a), el("label", { htmlFor: b.id }, "Salida", b), x));
    });
  }
  const removed = []; draw();
  const add = el("button", { className: "btn-plain", type: "button", textContent: "+ Agregar horario" });
  add.addEventListener("click", () => { rows.push({ entrada: "", salida: "" }); draw(); });
  const save = el("button", { className: "btn-main", type: "button", textContent: "Guardar" });
  const cancel = el("button", { className: "btn-plain", type: "button", textContent: "Cancelar" });
  cancel.addEventListener("click", closeSheet);
  save.addEventListener("click", async () => {
    if (rows.some(r => !r.entrada)) { toast("Falta la hora de entrada."); return; }
    save.disabled = true;
    try {
      for (const r of removed) if (r.id) await state.db.doc("turnos/" + r.id).delete();
      for (const r of rows) {
        if (!r.id) await state.db.collection("turnos").add({ persona: name, dia, entrada: r.entrada, salida: r.salida || "", mano: true, marcado: new Date().toISOString() });
        else if (r.entrada !== r.orig.entrada || (r.salida || "") !== r.orig.salida)
          await state.db.doc("turnos/" + r.id).update({ entrada: r.entrada, salida: r.salida || "", mano: true });
      }
      toast("Guardado"); closeSheet();
    } catch (e) { save.disabled = false; toast(e && e.code === "invalid_argument" ? "No tenés permiso para corregir." : "No se pudo guardar. Probá de nuevo."); }
  });
  box.append(el("h3", { textContent: name }), el("p", { className: "status", textContent: DIAS[(d.getDay() + 1) % 7] + " " + ddmm(d) + ". Si sale después de las 00, poné la hora igual (ej. 01:30): se cuenta como del mismo turno." }), list);
  if (state.canWrite) box.append(el("div", { className: "row" }, add), el("div", { className: "row end" }, cancel, save));
  else box.append(el("p", { className: "note", textContent: "Con tu acceso solo podés ver la planilla." }), el("div", { className: "row end" }, cancel));
  $("sheet").hidden = false;
}

function openStaff() {
  const box = $("sheetbox"); box.textContent = "";
  const ta = el("textarea", { id: "staffnames", value: state.staff.map(n => state.valores[n] ? n + ": " + state.valores[n] : n).join("\n") });
  const fe = el("input", { type: "text", id: "valfecha", value: state.valoresFecha, placeholder: "ej. 09/26" });
  const save = el("button", { className: "btn-main", type: "button", textContent: "Guardar lista" });
  const cancel = el("button", { className: "btn-plain", type: "button", textContent: "Cancelar" }); cancel.addEventListener("click", closeSheet);
  save.addEventListener("click", async () => {
    const nombres = [], valores = {};
    for (const line of ta.value.split("\n")) {
      const m = line.match(/^(.*?)(?:[:;=]\s*\$?\s*([\d.,]+))?\s*$/); const n = (m[1] || "").trim(); if (!n || nombres.includes(n)) continue;
      nombres.push(n); if (m[2]) valores[n] = Number(m[2].replace(/\./g, "").replace(",", "."));
    }
    save.disabled = true;
    try { await state.db.doc("config/personal").set({ nombres, valores, valoresFecha: fe.value.trim() }); toast("Lista guardada"); closeSheet(); }
    catch (e) { save.disabled = false; toast("No se pudo guardar la lista."); }
  });
  box.append(el("h3", { textContent: "Lista de personal" }), el("label", { htmlFor: "staffnames", className: "status", textContent: "Un nombre por renglón, en el orden en que querés verlos. Después de los dos puntos va el valor de la hora (ej. Laura: 9941)." }), ta,
    el("label", { htmlFor: "valfecha", className: "status", textContent: "Mes de los valores" }), fe, el("div", { className: "row end" }, cancel, save));
  $("sheet").hidden = false; ta.focus();
}

/* ---------- datos ---------- */
function subscribeWeek() {
  if (state.unsubWeek) state.unsubWeek();
  const a = iso(state.weekStart), b = iso(addDays(state.weekStart, 6));
  state.unsubWeek = state.db.collection("turnos").where("dia", ">=", a).where("dia", "<=", b).onSnapshot(s => {
    state.week = s.docs.map(d => ({ id: d.id, ...d.data() })); renderWeek();
  }, () => note("Se cortó la conexión con la planilla. Recargá la página."));
  renderWeek();
}
function moveWeek(n) { state.weekStart = n === 0 ? startOfWeek(new Date()) : addDays(state.weekStart, 7 * n); state.week = []; if (state.db) subscribeWeek(); else renderWeek(); }
$("prev").addEventListener("click", () => moveWeek(-1));
$("next").addEventListener("click", () => moveWeek(1));
$("thisweek").addEventListener("click", () => moveWeek(0));
$("editstaff").addEventListener("click", openStaff);

renderPeople(); renderWeek();

(async () => {
  const [db, user] = await Promise.all([window.claude?.use?.("db") ?? null, window.claude?.use?.("user") ?? null]);
  if (!db) { note("Esta planilla se usa desde claude.ai con tu cuenta. Abrila desde el link que te pasaron e iniciá sesión."); return; }
  state.db = db; state.user = user;
  const cw = user ? await user.can("data.write") : null;
  state.canWrite = cw !== false; state.canEdit = user ? await user.canEdit() : false;
  $("editstaff").hidden = !state.canEdit;
  const timer = setTimeout(() => note("La planilla tarda en responder. Revisá la conexión a internet."), 10000);
  db.doc("config/personal").onSnapshot(s => {
    clearTimeout(timer); note(state.canWrite ? "" : "Con tu acceso solo podés ver la planilla.");
    const d = s.exists ? s.data() : {}; state.staff = d.nombres || []; state.valores = d.valores || {}; state.valoresFecha = d.valoresFecha || ""; renderPeople(); renderWeek();
  }, () => note("Se cortó la conexión con la planilla. Recargá la página."));
  db.collection("turnos").where("salida", "==", "").onSnapshot(s => {
    state.open = s.docs.map(d => ({ id: d.id, ...d.data() })); renderPeople();
  });
  subscribeWeek();
})();
</script>
