<title>Cuentas La Caleta</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Marcellus&display=swap">
<style>
/* Misma app que Horarios: columna angosta, lista de clientes, hoja que sube con el detalle y el mensaje tal cual se ve en WhatsApp */
:root{--paper:#f6f4ef;--card:#fff;--ink:#161616;--muted:#6b6760;--line:#e3dfd6;--in:#2f6b4f;--in-bg:#e7f0ea;--out:#9b3b2e;--warn:#a8661b;--warn-bg:#fbf1e3;--wa:#1f8a4c;--wa-chat:#efeae2;--wa-bubble:#d9fdd3;--wa-ink:#111b21;--logo-f:none;
--f-display:"Marcellus","Optima",Georgia,serif;--f-body:"Figtree",-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#121211;--card:#1c1c1a;--ink:#f2efe8;--muted:#a39f96;--line:#2e2d2a;--in:#7cc59f;--in-bg:#1b2b22;--out:#ec8f80;--warn:#e6a659;--warn-bg:#2c2216;--wa:#25a35a;--wa-chat:#0b141a;--wa-bubble:#005c4b;--wa-ink:#e9edef;--logo-f:invert(1);color-scheme:dark}}
:root[data-theme="dark"]{--paper:#121211;--card:#1c1c1a;--ink:#f2efe8;--muted:#a39f96;--line:#2e2d2a;--in:#7cc59f;--in-bg:#1b2b22;--out:#ec8f80;--warn:#e6a659;--warn-bg:#2c2216;--wa:#25a35a;--wa-chat:#0b141a;--wa-bubble:#005c4b;--wa-ink:#e9edef;--logo-f:invert(1);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:16px/1.45 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:560px;margin:0 auto;padding-block:18px 48px;display:grid;gap:20px}
header{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:14px}
.logo{width:54px;height:auto;filter:var(--logo-f)}
.brand{font:24px/1.1 var(--f-display);letter-spacing:.12em}
.brand small{display:block;font:600 13px var(--f-body);color:var(--muted);margin-top:4px;letter-spacing:0}
.ejemplo{font-size:14px;color:var(--warn);background:var(--warn-bg);border:1px solid var(--warn);border-radius:12px;padding:10px 12px;margin:0}
.total{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:4px}
.total b{font:34px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.total span{color:var(--muted);font-size:14px}
nav{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px}
nav button{font:600 15px var(--f-body);padding:10px 4px;border:0;border-radius:10px;background:transparent;color:var(--muted);cursor:pointer}
nav button.on{background:var(--ink);color:var(--paper)}
.list{display:grid;gap:8px}
.cli{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:10px;text-align:left;width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;min-height:62px}
.cli b{font-weight:600;display:block}
.cli small{color:var(--muted);font-size:13px}
.cli .monto{font:19px var(--f-display);font-variant-numeric:tabular-nums;text-align:right}
.cli .monto small{display:block;font:600 12px var(--f-body)}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:17px var(--f-display);background:var(--paper);border:1px solid var(--line)}
.cli.viejo{border-color:var(--warn);background:var(--warn-bg)} .cli.viejo .monto small{color:var(--warn)}
.cli.enviado .monto small{color:var(--in)}
.cli.pago .av{background:var(--in);color:var(--card);border-color:var(--in)} .cli.pago .monto small{color:var(--in)}
.sheet{position:fixed;inset:0;background:rgba(10,10,10,.45);display:grid;place-items:end center;z-index:5}
.box{background:var(--card);width:min(520px,100%);max-height:94vh;overflow:auto;border-radius:22px 22px 0 0;display:grid;gap:14px;padding:22px 18px calc(26px + env(safe-area-inset-bottom,0px))}
@media (min-width:640px){.sheet{place-items:center}.box{border-radius:22px}}
.top{display:flex;justify-content:space-between;align-items:start;gap:10px}
.box h3{margin:0;font:26px/1.15 var(--f-display)}
.box .sub{color:var(--muted);font-size:14px}
.close{font:600 15px var(--f-body);background:none;border:0;color:var(--muted);cursor:pointer;padding:6px}
.chat{background:var(--wa-chat);border-radius:16px;padding:14px 12px}
.bubble{background:var(--wa-bubble);color:var(--wa-ink);border-radius:10px 10px 10px 2px;padding:9px 11px 6px;font:15px/1.4 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;white-space:pre-wrap;word-break:break-word;max-width:94%;margin-left:auto;border-top-right-radius:2px;border-bottom-left-radius:10px}
.bubble .hora{display:block;text-align:right;font-size:11px;opacity:.6;margin-top:2px}
.acciones{display:grid;gap:8px}
.wa{font:700 18px var(--f-body);padding:17px 10px;border:0;border-radius:16px;background:var(--wa);color:#fff;cursor:pointer;text-align:center;text-decoration:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ghost{font:600 15px var(--f-body);padding:14px 8px;border-radius:14px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.ghost.ok{background:var(--in);border-color:var(--in);color:var(--card)}
.ghost:disabled{opacity:.4;cursor:default}
.nota{margin:0;color:var(--muted);font-size:13px}
:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
[hidden]{display:none!important}
</style>

function $(i){return document.getElementById(i)}
function pesos(n){return(n<0?"–$":"$")+Math.round(Math.abs(n)).toLocaleString("es-AR")}

function nombre(c){return c.n.split(" ")[0]}
function cosas(it){return it.map(function(i){return(i[0]>1?i[0]+"× ":"")+i[1]}).join(", ")}
function cap(t){return t.charAt(0).toUpperCase()+t.slice(1)}
function mensaje(c){var L=[];
L.push("Hola "+nombre(c)+" 👋");
L.push("Te escribimos de *La Caleta* con el resumen de tu cuenta corriente del 04/11 al 10/11.");
L.push("");
if(c.ant)L.push("*Saldo anterior:* "+pesos(c.ant),"");

L.push("*Total a pagar: "+pesos(s)+"*","");

L.push("El saldo que quede sin pagar el miércoles se actualiza un 2,5%.")}
L.push("","¡Gracias! La Caleta · Yacht Club Rosario");
return L.join("\n")}

b.onclick=function(){abrir(i)};L.append(b)});
if(!L.children.length){var p=document.createElement("p");p.className="nota";p.textContent=filtro==="pagaron"?"Todavía nadie pagó esta semana.":filtro==="enviados"?"Todavía no mandaste mensajes. Tocá un cliente para mandarle el suyo.":"Nadie debe esta semana.";L.append(p)}
$("tot").textContent=pesos(tot);$("totsub").textContent=n+(n==1?" cliente debe":" clientes deben")}
function abrir(i){var c=CLI[i],t=mensaje(c),B=$("box");
B.innerHTML='<div class="top"><div><h3>'+c.n+'</h3><div class="sub">Tel. '+c.tel+' · debe '+pesos(c.pago?0:saldo(c))+'</div></div><button class="close" id="x">Cerrar</button></div>'+
'<div class="chat"><div class="bubble">'+wa(t)+'<span class="hora">12:30</span></div></div>'+
'<div class="acciones"><a class="wa" id="env" href="https://wa.me/?text='+encodeURIComponent(t)+'" target="_blank" rel="noopener">Mandar por WhatsApp</a>'+
'<div class="two"><button class="ghost'+(c.pago?' ok':'')+'" id="pagó">'+(c.pago?"Pagó ✓":"Marcar que pagó")+'</button><button class="ghost" id="copiar">Copiar mensaje</button></div>'+
'<button class="ghost" disabled>Hacer factura A (cuando esté el certificado)</button>'+
